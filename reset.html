<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Ogbe Dexter Echo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-brand">
      <div class="auth-brand-mid">
        <div class="auth-brand-name">Ogbe Dexter Echo<br><span>Portfolio</span></div>
        <p class="auth-brand-role">Software & brand developer. We'll help you get back into your account.</p>
      </div>
      <div class="auth-brand-bottom">&copy; 2026 Ogbe Dexter Echo</div>
    </div>

    <div class="auth-form-side">
      <div class="auth-card">
        <h1>Reset Password</h1>
        <p class="subtitle">Enter your email and we'll send you a verification code</p>
        <form>
          <input class="field" type="email" placeholder="Email" required>
          <input class="submit" type="submit" value="Send Verification Code">
          <p class="switch">Remembered your password? <a href="login.html">Login</a></p>
        </form>
      </div>
    </div>
  </div>
</body>
<style>
  :root {
    --bg-0: #050505;
    --bg-1: #120707;
    --card-0: #141010;
    --card-1: #1c0d0d;
    --red-600: #a4111f;
    --red-500: #e0263f;
    --red-400: #ff4a5e;
    --red-glow: rgba(224, 38, 63, 0.35);
    --line: rgba(255, 255, 255, 0.08);
    --text-hi: #f6f2f2;
    --text-lo: #a89a9a;
    --text-dim: #6f6262;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-0);
    color: var(--text-hi);
    font-family: 'Inter', Arial, Helvetica, sans-serif;
  }

  h1 {
    font-family: 'Sora', Arial, sans-serif;
    letter-spacing: -0.02em;
    margin: 0;
  }

  a { color: inherit; }

  /* ===== Form fields ===== */
  .field {
    width: 100%;
    height: 46px;
    padding: 0 16px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-hi);
    font-family: 'Inter', Arial, sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }

  .field::placeholder { color: var(--text-dim); }

  .field:focus {
    border-color: var(--red-500);
    background: rgba(224, 38, 63, 0.06);
    box-shadow: 0 0 0 4px var(--red-glow);
  }

  /* ===== Split-page layout ===== */
  .auth-page {
    min-height: 100vh;
    display: flex;
  }

  .auth-brand {
    position: relative;
    flex: 1 1 45%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 48px;
    background:
      radial-gradient(500px circle at 25% 20%, rgba(224, 38, 63, 0.18), transparent 60%),
      linear-gradient(165deg, var(--bg-1), var(--bg-0));
    overflow: hidden;
  }

  .auth-brand::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.5));
    pointer-events: none;
  }

  .auth-brand-mid {
    position: relative;
    z-index: 1;
  }

  .auth-brand-name {
    font-size: 42px;
    font-weight: 700;
    line-height: 1.15;
  }

  .auth-brand-name span {
    color: var(--red-400);
  }

  .auth-brand-role {
    margin-top: 10px;
    font-size: 15px;
    color: var(--text-lo);
    max-width: 360px;
    line-height: 1.6;
  }

  .auth-brand-bottom {
    position: relative;
    z-index: 1;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  .auth-form-side {
    flex: 1 1 55%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }

  .auth-card {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .auth-card h1 {
    font-size: 26px;
    font-weight: 700;
    color: var(--text-hi);
  }

  .auth-card .subtitle {
    margin: 6px 0 28px;
    font-size: 13.5px;
    color: var(--text-lo);
    text-align: center;
    line-height: 1.5;
  }

  .auth-card form {
    display: flex;
    flex-direction: column;
    width: 100%;
    gap: 14px;
  }

  .row-two { display: flex; gap: 10px; }

  .forgot {
    align-self: flex-end;
    margin-top: -4px;
    font-size: 12px;
    color: var(--text-lo);
    text-decoration: none;
  }

  .forgot:hover { color: var(--red-400); }

  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 2px 0;
  }

  .remember input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--red-500);
    cursor: pointer;
  }

  .remember label {
    font-size: 13.5px;
    color: var(--text-lo);
    cursor: pointer;
  }

  .submit {
    margin-top: 6px;
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--red-500), var(--red-600));
    color: #fff;
    font-family: 'Sora', Arial, sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    letter-spacing: 0.01em;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(224, 38, 63, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }

  .submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 30px rgba(224, 38, 63, 0.5);
    filter: brightness(1.08);
  }

  .submit:active { transform: translateY(0); }

  .switch {
    margin: 22px 0 0;
    font-size: 13px;
    color: var(--text-lo);
  }

  .switch a {
    color: var(--red-400);
    text-decoration: none;
    font-weight: 500;
  }

  .switch a:hover { text-decoration: underline; }

  @media (max-width: 820px) {
    .auth-page { flex-direction: column; }
    .auth-brand { padding: 32px; }
    .auth-brand-name { font-size: 32px; }
    .auth-form-side { padding: 32px 24px 56px; }
  }
</style>
</html>
